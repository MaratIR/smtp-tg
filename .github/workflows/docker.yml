name: Build and push image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DCR_REGISTRY }}
          username: ${{ secrets.DCR_USERNAME }}
          password: ${{ secrets.DCR_PASSWORD }}

      - name: Image tags
        id: meta
        run: |
          # DCR_IMAGE = full name without tag, e.g. registry.example.com/smtp_message
          IMAGE="${{ secrets.DCR_IMAGE }}"
          if [ -z "$IMAGE" ]; then
            echo "DCR_IMAGE secret is required" >&2
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
